[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bvar-toolkit"
version = "1.0.0"
description = "Large Bayesian VARs: the Python version of bvar-toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua C. C. Chan" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
keywords = ["Bayesian VAR", "vector autoregression", "macroeconometrics", "forecasting",
            "MCMC"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
tutorials = ["openpyxl>=3.1"]
dev = ["pytest>=8", "openpyxl>=3.1"]

[project.urls]
Repository = "https://github.com/joshuaccchan/bvar-toolkit-python"
"MATLAB version" = "https://github.com/joshuaccchan/bvar-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
