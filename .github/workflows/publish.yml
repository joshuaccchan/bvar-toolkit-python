# Builds the package and uploads it to PyPI when a release is published on GitHub. PyPI trusts
# this workflow (trusted publishing), so the repository stores no token. A version uploaded to
# PyPI can never be replaced, so the job stops unless the release tag matches the version in
# pyproject.toml.
name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check that the tag matches the version
        run: |
          python - <<'EOF'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == 'v' + version, f'tag {tag} does not match version {version}'
          EOF
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
