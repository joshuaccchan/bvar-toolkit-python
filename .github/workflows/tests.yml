# Runs the tests, which compare every ported function with test cases exported from the
# MATLAB toolkit, and the your_data.py script of every tutorial on its shipped settings.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Run the your_data.py script of every tutorial
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          for f in tutorials/*/your_data.py; do
            echo "---- $f"
            python "$f"
          done
